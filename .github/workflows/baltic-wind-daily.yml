name: Baltic Wind Energy News Report

on:
  # ---------------------------------------------------------------------
  # PAUSED 2026-08-03 at the user's request ("Stop agent"). All automatic
  # triggers are disabled, so no runs happen and no report emails are sent.
  # Only manual dispatch remains.
  #
  # To re-enable, uncomment the schedule / workflow_run / push blocks below.
  # The workflow_run chain was the one that actually delivered daily (fires
  # ~07:01 UTC = 10:01 Tallinn); cron alone was unreliable. See SCHEDULING.md.
  #
  #  schedule:
  #    - cron: "30 6 * * 1-5"   # 09:30 Tallinn in summer (EEST)
  #    - cron: "30 7 * * 1-5"   # 09:30 Tallinn in winter (EET)
  #  workflow_run:
  #    workflows: ["Estonian Law Daily Digest", "ERR News Trustworthiness Digest"]
  #    types: [completed]
  #  push:
  #    branches: ["main"]
  #    paths: ["baltic-wind-news-agent/trigger/**"]
  # ---------------------------------------------------------------------
  workflow_dispatch:
    inputs:
      force:
        # Defaults to FALSE: a plain "Run workflow" still respects the 09:30
        # Tallinn and once-per-day guards. Tick it to force a report now.
        description: "Bypass the 09:30 Tallinn and once-per-day guards"
        type: boolean
        default: false

concurrency:
  group: baltic-wind-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    # ~40 HTTP fetches plus 4 Claude calls; a normal run takes a few minutes.
    # The bot bounds its own API time (per-call timeouts, max_retries=1,
    # discovery deadline), so worst case stays well under this.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r baltic-wind-news-agent/requirements.txt

      - name: Find new projects and send report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          # Only manual dispatch forces; push- and cron-triggered runs obey
          # the local-time + once-per-day guard, so a trigger push outside
          # the window (or after a sent report) is a cheap no-op.
          FORCE_RUN: ${{ inputs.force && 'true' || 'false' }}
          PYTHONUNBUFFERED: "1"
        run: python baltic-wind-news-agent/bot/wind_agent.py

      - name: Commit updated state
        run: |
          git config user.name "baltic-wind-news-agent"
          git config user.email "bot@users.noreply.github.com"
          git add baltic-wind-news-agent/state/
          git diff --cached --quiet || git commit -m "chore: update baltic wind state [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
