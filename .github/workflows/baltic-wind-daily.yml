name: Baltic Wind Energy News Report

on:
  schedule:
    # Fallback trigger only — the reliable one is a Routine dispatching this
    # workflow (see SCHEDULING.md). 09:30 Europe/Tallinn is 06:30 UTC in
    # summer (EEST) / 07:30 UTC in winter (EET); the script's local-time guard
    # lets the right one through and skips the other, and last_run.json makes
    # a second run the same day a no-op.
    #
    # Keep this list SHORT. A 10-entry fan was tried on 2026-07-28 to work
    # around GitHub's cron lag and the workflow then got zero scheduled runs
    # the next day, while the repo's 2-entry workflows kept firing — matching
    # GitHub's documented throttling of high-frequency schedules.
    - cron: "30 6 * * 1-5"
    - cron: "30 7 * * 1-5"
  workflow_run:
    # Reliability chain — the real fix while this repo's cron keeps skipping
    # this workflow (zero scheduled runs on both 2026-07-28 and 2026-07-29).
    # These two digests DO get triggered every day, so run right after one of
    # them finishes: the law digest is dispatched ~07:00 UTC (10:00 Tallinn)
    # and ERR News fires by cron ~07:45 UTC. Both are past the 09:30 Tallinn
    # guard, and last_run.json means whichever lands first sends and the other
    # is a no-op. Needs no connector, no push, no Claude session.
    workflows: ["Estonian Law Daily Digest", "ERR News Trustworthiness Digest"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        # Defaults to FALSE on purpose: clicking "Run workflow" used to force
        # a send, which is how 2026-07-28 got three identical reports. Tick it
        # only when you deliberately want a duplicate/off-hours report.
        description: "Bypass the 09:30 Tallinn and once-per-day guards"
        type: boolean
        default: false
  push:
    # Manual escape hatch for anyone who has push access: committing a
    # timestamp to trigger/run-request.txt on main starts a run without the
    # Actions UI. State commits touch only state/ (and say [skip ci]), so
    # they never retrigger this.
    branches: ["main"]
    paths: ["baltic-wind-news-agent/trigger/**"]

concurrency:
  group: baltic-wind-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    # ~40 HTTP fetches plus 4 Claude calls; a normal run takes a few minutes.
    # The bot bounds its own API time (per-call timeouts, max_retries=1,
    # discovery deadline), so worst case stays well under this.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r baltic-wind-news-agent/requirements.txt

      - name: Find new projects and send report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          # Only manual dispatch forces; push- and cron-triggered runs obey
          # the local-time + once-per-day guard, so a trigger push outside
          # the window (or after a sent report) is a cheap no-op.
          FORCE_RUN: ${{ inputs.force && 'true' || 'false' }}
          PYTHONUNBUFFERED: "1"
        run: python baltic-wind-news-agent/bot/wind_agent.py

      - name: Commit updated state
        run: |
          git config user.name "baltic-wind-news-agent"
          git config user.email "bot@users.noreply.github.com"
          git add baltic-wind-news-agent/state/
          git diff --cached --quiet || git commit -m "chore: update baltic wind state [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
