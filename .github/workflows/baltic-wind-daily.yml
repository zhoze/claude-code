name: Baltic Wind Energy News Report

on:
  schedule:
    # Cron is the ONLY trigger that needs no credentials, so it carries the
    # daily report on its own (no Claude session can start a run: Routine-fired
    # sessions have neither GitHub MCP nor git push to this repo).
    #
    # Target is 09:30 Europe/Tallinn = 06:30 UTC in summer (EEST) / 07:30 UTC
    # in winter (EET), but GitHub delays this repo's crons by 2-4 h. So fire
    # every 30 min across the morning: the first attempt that actually runs
    # sends the report, and `state/last_run.json` turns every later one into a
    # ~20 s no-op. More entries = better odds of landing near 09:30, never a
    # duplicate report.
    - cron: "30 6 * * 1-5"
    - cron: "0 7 * * 1-5"
    - cron: "30 7 * * 1-5"
    - cron: "0 8 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "0 9 * * 1-5"
    - cron: "30 9 * * 1-5"
    - cron: "0 10 * * 1-5"
    - cron: "30 10 * * 1-5"
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside 09:30 Europe/Tallinn workdays"
        type: boolean
        default: true
  push:
    # Manual escape hatch for anyone who has push access: committing a
    # timestamp to trigger/run-request.txt on main starts a run without the
    # Actions UI. State commits touch only state/ (and say [skip ci]), so
    # they never retrigger this.
    branches: ["main"]
    paths: ["baltic-wind-news-agent/trigger/**"]

concurrency:
  group: baltic-wind-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    # ~40 HTTP fetches plus 4 Claude calls; a normal run takes a few minutes.
    # The bot bounds its own API time (per-call timeouts, max_retries=1,
    # discovery deadline), so worst case stays well under this.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r baltic-wind-news-agent/requirements.txt

      - name: Find new projects and send report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          # Only manual dispatch forces; push- and cron-triggered runs obey
          # the local-time + once-per-day guard, so a trigger push outside
          # the window (or after a sent report) is a cheap no-op.
          FORCE_RUN: ${{ inputs.force && 'true' || 'false' }}
          PYTHONUNBUFFERED: "1"
        run: python baltic-wind-news-agent/bot/wind_agent.py

      - name: Commit updated state
        run: |
          git config user.name "baltic-wind-news-agent"
          git config user.email "bot@users.noreply.github.com"
          git add baltic-wind-news-agent/state/
          git diff --cached --quiet || git commit -m "chore: update baltic wind state [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
