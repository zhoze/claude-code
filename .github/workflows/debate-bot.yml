name: Telegram Debate Bot

on:
  # Bot paused by owner request. To re-enable, restore:
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: debate-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tg-debate-bot/requirements.txt

      - name: Poll Telegram and answer
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DEBATE_TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ALLOWED_CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}
        run: python tg-debate-bot/bot/poll_and_answer.py

      - name: Commit updated offset
        run: |
          git config user.name "debate-bot"
          git config user.email "bot@users.noreply.github.com"
          git add tg-debate-bot/state/offset.txt
          git diff --cached --quiet || git commit -m "chore: update telegram offset [skip ci]"
          git pull --rebase
          git push
