name: Hermes stock screener

# Offline tests + demo on every push touching hermes-screener/, and a live run with
# real data via "Run workflow". The live run needs two secrets in the GitHub
# Environment "screen" (Settings -> Environments -> screen -> Environment secrets):
#   FMP_KEY      Financial Modeling Prep key (already used by the Russell 1000 screens)
#   MASSIVE_KEY  Massive (formerly Polygon) REST API key
#   MASSIVE_S3_ACCESS_KEY_ID / MASSIVE_S3_SECRET_ACCESS_KEY
#                Massive Flat Files S3 credentials (bulk price history; dashboard/keys)
# Keys are passed as environment variables only; they are never written to the repo.

on:
  push:
    paths:
      - "hermes-screener/**"
      - ".github/workflows/hermes-screener.yml"
  workflow_dispatch:
    inputs:
      limit:
        description: "Universe size (largest N names; empty = full Russell 1000 proxy)"
        default: ""
        required: false
      history_years:
        description: "Price history depth in years (empty = config default)"
        default: "1"
        required: false
      history_source:
        description: "Massive price source: auto | flatfiles | grouped | rest"
        default: "grouped"
        required: false
      options_check:
        description: "Require listed options (one Massive call per name)"
        type: boolean
        default: false
      massive_rpm:
        description: "Massive requests/minute cap (empty = unlimited; free Basic plan = 5)"
        default: ""
        required: false
      live:
        description: "Run the live pass with FMP + Massive data"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hermes-screener
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Unit + end-to-end tests (synthetic data, no keys)
        run: python -m pytest -q
      - name: Offline demo run
        run: |
          python run_nightly.py --demo --root "$RUNNER_TEMP/demo"
          cat "$RUNNER_TEMP"/demo/reports/*/report.md >> "$GITHUB_STEP_SUMMARY"

  live:
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: screen   # holds the FMP_KEY and MASSIVE_KEY secrets
    # push: live only when the commit message contains [live]; dispatch: the 'live' input
    if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[live]')) || inputs.live
    defaults:
      run:
        working-directory: hermes-screener
    env:
      FMP_KEY: ${{ secrets.FMP_KEY }}
      MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
      MASSIVE_S3_ACCESS_KEY_ID: ${{ secrets.MASSIVE_S3_ACCESS_KEY_ID }}
      MASSIVE_S3_SECRET_ACCESS_KEY: ${{ secrets.MASSIVE_S3_SECRET_ACCESS_KEY }}
      LIMIT: ${{ inputs.limit }}
      HISTORY_YEARS: ${{ inputs.history_years || '1' }}
      HISTORY_SOURCE: ${{ inputs.history_source || 'grouped' }}
      OPTIONS_CHECK: ${{ inputs.options_check && 'true' || 'false' }}
      MASSIVE_RPM: ${{ inputs.massive_rpm }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check secrets
        id: keys
        run: |
          missing=""
          [ -n "$FMP_KEY" ] || missing="$missing FMP_KEY"
          [ -n "$MASSIVE_KEY" ] || missing="$missing MASSIVE_KEY"
          if [ -n "$missing" ]; then
            echo "::warning::Live run skipped — missing secret(s):$missing (add them to the 'screen' environment)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore Massive flat-file cache
        uses: actions/cache@v4
        with:
          path: |
            hermes-screener/data/flatfiles
            hermes-screener/data/grouped
            hermes-screener/data/cache
          key: massive-flatfiles-${{ github.run_id }}
          restore-keys: massive-flatfiles-
      - name: API probe (HTTP status per endpoint)
        if: steps.keys.outputs.ok == 'true'
        continue-on-error: true
        run: |
          python scripts/probe_apis.py AAPL | tee probe.txt
          { echo '### API probe'; echo '```'; cat probe.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Live nightly pass
        if: steps.keys.outputs.ok == 'true'
        run: |
          args=""
          [ -n "$LIMIT" ] && args="--limit $LIMIT"
          [ -n "$MASSIVE_RPM" ] && args="$args --massive-rpm $MASSIVE_RPM"
          [ -n "$HISTORY_YEARS" ] && args="$args --history-years $HISTORY_YEARS"
          [ -n "$HISTORY_SOURCE" ] && args="$args --history-source $HISTORY_SOURCE"
          [ "$OPTIONS_CHECK" = "true" ] || args="$args --no-options-check"
          echo "run_nightly.py $args"
          python run_nightly.py $args
      - name: Report to job summary
        if: always() && steps.keys.outputs.ok == 'true'
        run: |
          for f in reports/*/report.md; do [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"; done
          for f in data/snapshots/*/manifest.json; do
            [ -f "$f" ] && { echo '### API HTTP status by endpoint'; echo '```json';
              python -c "import json,sys; print(json.dumps(json.load(open(sys.argv[1])).get('http_status'), indent=1))" "$f";
              echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
          for f in data/snapshots/*/fetch_failures.json; do
            [ -f "$f" ] && { echo '### Fetch failures'; echo '```json'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload reports
        if: always() && steps.keys.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hermes-reports
          path: |
            hermes-screener/reports/
            hermes-screener/audit/
            hermes-screener/data/snapshots/*/manifest.json
            hermes-screener/data/snapshots/*/fetch_failures.json
            hermes-screener/data/snapshots/*/liquidity.csv
          if-no-files-found: warn
