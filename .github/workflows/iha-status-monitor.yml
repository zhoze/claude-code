name: iha.ee status monitor

on:
  schedule:
    # Hourly at :07, 06:00-20:00 UTC == 09:07-23:07 Estonia time (EEST, UTC+3)
    - cron: "7 6-20 * * *"
  workflow_dispatch: {}

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check status and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IHA_USERNAMES: "Suk87,deluxmassaaz"
        run: python3 scripts/check_iha_status.py
