name: Email Inbox Daily Digest

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC daily
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside 09:00 UTC"
        type: boolean
        default: true
      since:
        description: "Override lookback start (ISO 8601, UTC, e.g. 2026-07-20T00:00:00+00:00)"
        type: string
        default: ""

concurrency:
  group: email-inbox-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r email-inbox-agent/requirements.txt

      - name: Check inbox and send digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          FORCE_RUN: ${{ inputs.force && 'true' || 'false' }}
          SINCE: ${{ inputs.since }}
        run: python email-inbox-agent/bot/inbox_agent.py ${SINCE:+--since "$SINCE"}

      - name: Commit updated state
        run: |
          git config user.name "email-inbox-agent"
          git config user.email "bot@users.noreply.github.com"
          git add email-inbox-agent/state/last_check.json
          git diff --cached --quiet || git commit -m "chore: update email inbox digest state [skip ci]"
          git pull --rebase
          git push
