# Manual refresh of the value-screener dataset (default universe: Russell 1000).
# Requires the FMP_KEY secret in the "screen" GitHub Environment.
# Manual-only (workflow_dispatch) so it never runs automatically.
name: Refresh screener dataset

on:
  workflow_dispatch:
    inputs:
      universe:
        description: "Universe to build"
        type: choice
        default: russell1000
        options:
          - russell1000
          - sp500

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: screen   # uses the GitHub Environment "screen" (and its FMP_KEY secret)
    defaults:
      run:
        working-directory: value-screener
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # TEMP: routed to the walk-forward backtest so it can be dispatched from this
      # branch (the dedicated backtest-screener.yml isn't on the default branch yet).
      # Reverted in the next commit.
      - name: Run backtest (FMP)
        env:
          FMP_KEY: ${{ secrets.FMP_KEY }}   # stored secret — never hardcoded
        run: python3 backtest.py --days 60 --top 10
