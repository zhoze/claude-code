# Manual refresh of the value-screener dataset (default universe: Russell 1000).
# Requires the FMP_KEY secret in the "screen" GitHub Environment.
# Manual-only (workflow_dispatch) so it never runs automatically.
name: Refresh screener dataset

on:
  workflow_dispatch:
    inputs:
      universe:
        description: "Universe to build"
        type: choice
        default: russell1000
        options:
          - russell1000
          - sp500

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: screen   # uses the GitHub Environment "screen" (and its FMP_KEY secret)
    defaults:
      run:
        working-directory: value-screener
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pull fresh data (FMP)
        env:
          FMP_KEY: ${{ secrets.FMP_KEY }}   # stored secret — never hardcoded
        run: python3 refresh_universe.py --universe "${{ inputs.universe || 'russell1000' }}"

      - name: Run screens
        run: |
          python3 screener.py
          python3 overall.py --all

      - name: Commit refreshed data + results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto-refresh ${{ inputs.universe }} screener data [skip ci]" || echo "no changes"
          git push
