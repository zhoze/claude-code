# Manual refresh of the value-screener S&P 500 dataset.
# Requires repo secret FMP_KEY (Settings -> Secrets and variables -> Actions).
# Manual-only (workflow_dispatch) so it never runs automatically.
name: Refresh S&P 500 screener

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: screen   # uses the GitHub Environment "screen" (and its FMP_KEY secret)
    defaults:
      run:
        working-directory: value-screener
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pull fresh S&P 500 data (FMP)
        env:
          FMP_KEY: ${{ secrets.FMP_KEY }}   # stored secret — never hardcoded
        run: python3 refresh_sp500.py

      - name: Run screens
        run: |
          python3 screener.py
          python3 overall.py --all

      - name: Commit refreshed data + results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto-refresh S&P 500 screener data [skip ci]" || echo "no changes"
          git push
