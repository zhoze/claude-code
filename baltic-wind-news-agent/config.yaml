# Baltic wind energy news agent configuration.
#
# The agent finds NEWLY ANNOUNCED planned wind-farm projects in Estonia,
# Latvia and Lithuania and emails a workday report with links. Projects
# already in state/reported_projects.json are never reported again.
# Reference source collections live in sources/*.md; the fetchable subset
# is configured below. Feeds/pages that fail are logged and skipped.

recipient_email: priitmr@gmail.com

# Model (keep names here, never hardcoded in the script)
claude_model: claude-sonnet-5
# web_search max_uses per per-country discovery call. Each search costs
# roughly 2 minutes of wall clock, so this is the main lever on sweep
# duration; 3 keeps a sweep near 6 min (the three countries run in parallel).
discovery_web_max_uses: 3

# 09:30 Europe/Tallinn guard, workdays only (Mon-Fri)
run_hour_tallinn: 9
run_minute_tallinn: 30

# RSS feeds (all verified live 2026-07-26)
rss_sources:
  - name: ERR News
    rss_url: https://news.err.ee/rss
  - name: LSM English
    rss_url: https://eng.lsm.lv/rss/
  - name: LRT English
    rss_url: https://www.lrt.lt/en/news-in-english?rss
  - name: BalticWind.EU
    rss_url: https://balticwind.eu/feed/
  - name: OffshoreWIND.biz
    rss_url: https://www.offshorewind.biz/feed/
  - name: Baltic News Network
    rss_url: https://bnn-news.com/feed
  - name: The Baltic Times
    rss_url: https://www.baltictimes.com/rss/
  - name: 15min
    rss_url: https://www.15min.lt/rss
  - name: Dienas Bizness
    rss_url: https://www.db.lv/rss
  - name: Äripäev
    rss_url: https://www.aripaev.ee/rss
  - name: Nordex Group
    rss_url: https://www.nordex-online.com/en/feed/

# Non-RSS listing pages: anchors are extracted and keyword-prefiltered.
# Developer/OEM newsrooms, associations, and the municipality shortlist
# from sources/baltic_municipalities_wind_farm_news_links.md.
