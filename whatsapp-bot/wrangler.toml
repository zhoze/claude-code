name = "whatsapp-claude-bot"
main = "worker.js"
compatibility_date = "2026-07-01"

# Create with: npx wrangler kv namespace create CHAT_HISTORY
kv_namespaces = [
  { binding = "CHAT_HISTORY", id = "REPLACE_WITH_KV_NAMESPACE_ID" }
]

[vars]
# Twilio sandbox number (console -> Messaging -> Try it out -> WhatsApp),
# or your registered WhatsApp sender. Keep the "whatsapp:" prefix.
TWILIO_WHATSAPP_FROM = "whatsapp:+14155238886"
# The specific person's number in E.164 WITH '+', e.g. +37255512345
ALLOWED_WA_NUMBER = "REPLACE_WITH_PERSON_NUMBER"
CLAUDE_MODEL = "claude-opus-4-8"

# Secrets (set with `npx wrangler secret put <NAME>`, never commit):
#   ANTHROPIC_API_KEY    - console.anthropic.com API key
#   TWILIO_ACCOUNT_SID   - Twilio console dashboard (starts with AC)
#   TWILIO_AUTH_TOKEN    - Twilio console dashboard; also signs webhooks
#   PERSONA              - system prompt: who "you" are and how you write
